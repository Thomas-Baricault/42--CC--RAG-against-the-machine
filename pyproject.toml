[project]
name = "RAG-against-the-machine"
version = "1.0.0"
description = "A project about RAG (Retrieving Augmented Generation)"
authors = [
  { name = "tbaricau", email = "tbaricau@student.42lehavre.fr" }
]
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "bm25s",
    "fire",
